<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandeja privada | SBM Conecta</title><style>body{font:16px system-ui;background:#f4f6fa;color:#233148;margin:0}main{max-width:1100px;margin:auto;padding:24px}header,.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 18px #0011}input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccd}button{background:#e96b23;color:white;cursor:pointer;border:0}button:disabled{opacity:.5}h1{color:#e96b23}small{color:#657}p{white-space:pre-wrap}a{color:#bd4e14}.hidden{display:none}@media print{header,#login,#controls,button,select,.no-print{display:none!important}body{background:white}.card{box-shadow:none;border:1px solid #ddd}}</style></head><body><main><header><h1>SBM Conecta · Propuestas</h1><a href="index.html">Volver a la revista</a></header><section id="login" class="card"><h2>Acceso privado</h2><p>Solo la cuenta autorizada de iretana@yahoo.com puede revisar propuestas.</p><form id="auth"><input type="email" id="email" value="iretana@yahoo.com" required aria-label="Correo"><input type="password" id="password" placeholder="Contraseña de Supabase" required aria-label="Contraseña"><button>Ingresar</button></form><p id="authmsg" role="status"></p><small>Necesitás una cuenta en Supabase Auth del proyecto Control de Vacaciones con este correo.</small></section><section id="private" class="hidden"><div id="controls" class="bar"><strong id="count"></strong><div><button id="refresh">Actualizar</button> <button id="logout">Salir</button></div></div><div id="items"></div></section><p id="msg" role="status"></p></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.95.0';
import JSZip from 'https://esm.sh/jszip@3.10.1';
const sb=createClient('https://ihajshxnmakyobcubqlq.supabase.co','sb_publishable_c4A_lPxTe0FCm_KoChNIGQ_yMlt6lV5');
const api='https://ihajshxnmakyobcubqlq.supabase.co/functions/v1/sbm-conecta-admin';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let proposals=[];
async function call(data){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Iniciá sesión');const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}
async function load(){try{$('msg').textContent='Cargando propuestas…';proposals=(await call({action:'list'})).propuestas;$('count').textContent=proposals.filter(p=>p.estado==='recibida').length+' nuevas · '+proposals.length+' en total';$('items').innerHTML=proposals.map((p,i)=>'<article class="card"><div class="bar"><h2>'+esc(p.tipo)+' · '+esc(p.nombre)+'</h2><small>'+new Date(p.created_at).toLocaleString('es-CR')+'</small></div><strong>Proyecto: '+esc(p.proyecto)+'</strong><p>'+esc(p.contenido)+'</p>'+(p.beneficios?'<p><strong>Beneficios:</strong> '+esc(p.beneficios)+'</p>':'')+(p.contacto?'<p><strong>Contacto:</strong> '+esc(p.contacto)+'</p>':'')+'<div class="bar no-print"><label>Estado <select data-index="'+i+'" class="status">'+['recibida','en_revision','remitida','descartada'].map(s=>'<option value="'+s+'" '+(s===p.estado?'selected':'')+'>'+s.replace('_',' ')+'</option>').join('')+'</select></label><div><button class="'+(String(p.tipo).toLowerCase().includes('eslogan')?'pptx':'pdf')+'" data-index="'+i+'">'+(String(p.tipo).toLowerCase().includes('eslogan')?'Descargar PowerPoint':'Preparar PDF')+'</button> '+(p.fotos||[]).map((f,k)=>'<button class="photo" data-index="'+i+'" data-photo="'+k+'">Foto '+(k+1)+'</button>').join(' ')+'</div></div></article>').join('')||'<p>No hay propuestas todavía.</p>';$('msg').textContent=''}catch(e){$('msg').textContent=e.message}}
$('auth').onsubmit=async e=>{e.preventDefault();$('authmsg').textContent='Verificando…';const{error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('authmsg').textContent='No se pudo ingresar: '+error.message;return}await show()};
async function show(){$('login').classList.add('hidden');$('private').classList.remove('hidden');await load()}
$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('items').addEventListener('change',async e=>{if(!e.target.matches('.status'))return;const p=proposals[+e.target.dataset.index];try{await call({action:'status',id:p.id,estado:e.target.value});await load()}catch(err){alert(err.message)}});
$('items').addEventListener('click',async e=>{const b=e.target;if(b.matches('.pdf')){const p=proposals[+b.dataset.index];const w=window.open('','_blank');if(!w)return alert('Permití las ventanas emergentes para generar PDF');w.document.write('<html><head><title>Propuesta SBM Conecta</title><style>body{font:16px Arial;max-width:750px;margin:50px auto;line-height:1.5}h1{color:#e96b23}p{white-space:pre-wrap}</style></head><body><h1>SBM Conecta · '+esc(p.tipo)+'</h1><p><b>Colaborador:</b> '+esc(p.nombre)+'</p><p><b>Proyecto:</b> '+esc(p.proyecto)+'</p><p><b>Fecha:</b> '+new Date(p.created_at).toLocaleDateString('es-CR')+'</p><h2>Propuesta</h2><p>'+esc(p.contenido)+'</p><h2>Beneficios</h2><p>'+esc(p.beneficios)+'</p><p><small>Propuesta remitida para valoración editorial. No implica aprobación.</small></p></body></html>');w.document.close();w.focus();w.print()}if(b.matches('.pptx')){b.disabled=true;try{await downloadSlogan(proposals[+b.dataset.index])}catch(err){alert('No se pudo generar el PowerPoint: '+err.message)}finally{b.disabled=false}}if(b.matches('.photo')){try{const p=proposals[+b.dataset.index],path=p.fotos[+b.dataset.photo];const d=await call({action:'photo',path});window.open(d.url,'_blank','noopener')}catch(err){alert(err.message)}}});
async function downloadSlogan(p){
 const result=await call({action:'template_url'});const url=result.url;if(!url)throw Error('No se recibió la URL de la plantilla');
 const response=await fetch(url);if(!response.ok)throw Error('No se pudo descargar la plantilla oficial');
 const zip=await JSZip.loadAsync(await response.arrayBuffer());const slide=zip.file('ppt/slides/slide1.xml');if(!slide)throw Error('La plantilla no contiene la diapositiva esperada');
 const xml=new DOMParser().parseFromString(await slide.async('string'),'application/xml');if(xml.getElementsByTagName('parsererror').length)throw Error('No se pudo interpretar la plantilla');
 const shapes=Array.from(xml.getElementsByTagNameNS('http://schemas.openxmlformats.org/presentationml/2006/main','sp'));
 const nodes=shape=>Array.from(shape.getElementsByTagNameNS('http://schemas.openxmlformats.org/drawingml/2006/main','t'));
 const txt=shape=>nodes(shape).map(n=>n.textContent).join('');
 function replaceShape(shape,value){const t=nodes(shape);if(!t.length)throw Error('Falta un campo editable en la plantilla');t[0].textContent=value;for(let i=1;i<t.length;i++)t[i].textContent=''}
 const slogan=shapes.find(s=>txt(s).includes('Colocar el Slogan'));const attribution=shapes.find(s=>txt(s).includes('nos compartió el slogan'));
 if(!slogan||!attribution)throw Error('No se encontraron los campos de la plantilla RH-F-42');
 replaceShape(slogan,String(p.contenido||''));const first=String(p.nombre||'').trim().split(/\s+/)[0];replaceShape(attribution,'Nuestra compañera '+p.nombre+', del proyecto '+p.proyecto+', nos compartió el slogan que le daría a SBM. ¡Gracias '+first+'!');
 zip.file('ppt/slides/slide1.xml',new XMLSerializer().serializeToString(xml));
 const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
 const objectUrl=URL.createObjectURL(blob),a=document.createElement('a');a.href=objectUrl;a.download='SBM_Conecta_Eslogan_'+String(p.nombre||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_')+'.pptx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),30000);
}
const {data:{session}}=await sb.auth.getSession();if(session)await show();
</script></body></html>
