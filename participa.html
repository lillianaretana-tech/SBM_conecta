<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparte tu idea | SBM Conecta</title><style>body{margin:0;background:#f4f6f9;color:#202c3b;font:16px system-ui,Arial}main{max-width:640px;margin:32px auto;background:white;padding:clamp(18px,5vw,36px);border-radius:20px;box-shadow:0 10px 35px #20304015}h1{color:#e76720}label{display:block;margin-top:17px;font-weight:600}input,select,textarea{box-sizing:border-box;display:block;width:100%;padding:12px;border:1px solid #bac3cc;border-radius:9px;margin-top:6px;font:inherit}input[type=checkbox]{display:inline;width:auto}button{background:#e76720;color:white;border:0;border-radius:9px;padding:14px 20px;font-weight:bold;font-size:16px;cursor:pointer}button:disabled{opacity:.55}small{display:block;color:#596575}a{color:#c35115}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}#msg{font-weight:600}#website{position:absolute;left:-9999px}</style></head><body><main><a href="index.html">← Volver a SBM Conecta</a><h1>Comparte tu idea 💡</h1><p>Tu propuesta llegará a revisión antes de remitirse a la oficina. La oficina decide si se publica.</p><form id="form"><label>¿Qué querés compartir?<select name="tipo" required><option value="eslogan">Un eslogan</option><option value="innovacion">Una innovación</option><option value="historia">Una historia o reconocimiento</option></select></label><label>Tu nombre completo<input name="nombre" minlength="2" maxlength="120" required></label><label>Proyecto donde trabajás<input name="proyecto" minlength="2" maxlength="120" required></label><label>Contanos tu propuesta<textarea name="contenido" rows="5" minlength="5" maxlength="3000" required></textarea></label><label>¿Qué beneficios aporta? (opcional)<textarea name="beneficios" rows="3" maxlength="1500"></textarea></label><label>Contacto para consultas (opcional)<input name="contacto" maxlength="150"></label><label>Fotografías (opcional, máximo 3)<input id="fotos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><small>Reducimos automáticamente las fotografías antes de enviarlas. No adjuntés imágenes de instalaciones de clientes sin autorización.</small><label style="font-weight:400"><input type="checkbox" name="autorizacion_fotos"> Confirmo que tengo autorización para compartir las fotografías que adjunte.</label><input id="website" name="website" autocomplete="off" tabindex="-1"><p id="msg" role="status" aria-live="polite"></p><div class="actions"><a href="index.html">Cancelar</a><button id="send" type="submit">Enviar propuesta</button></div></form></main><script>
const endpoint='https://ihajshxnmakyobcubqlq.supabase.co/functions/v1/sbm-conecta-recibir';
const form=document.getElementById('form'),msg=document.getElementById('msg'),send=document.getElementById('send');
async function compress(file){const bmp=await createImageBitmap(file);const scale=Math.min(1,1200/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close();let q=.8,blob;do{blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));q-=.1}while(blob.size>250000&&q>=.4);if(blob.size>400000)throw Error('Una fotografía sigue siendo demasiado grande');return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)})}
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Preparando propuesta…';send.disabled=true;try{const d=new FormData(form),files=[...document.getElementById('fotos').files];if(files.length>3)throw Error('Podés adjuntar máximo 3 fotografías');if(files.length&&!d.has('autorizacion_fotos'))throw Error('Confirmá la autorización de las fotografías');if(files.some(f=>!['image/jpeg','image/png','image/webp'].includes(f.type)))throw Error('Solo se aceptan fotografías JPG, PNG o WebP');const fotos=[];for(const file of files){msg.textContent='Comprimiendo fotografías…';fotos.push(await compress(file))}msg.textContent='Enviando…';const payload={tipo:d.get('tipo'),nombre:d.get('nombre'),proyecto:d.get('proyecto'),contenido:d.get('contenido'),beneficios:d.get('beneficios'),contacto:d.get('contacto'),autorizacion_fotos:d.has('autorizacion_fotos'),website:d.get('website'),fotos};const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok||!data.ok)throw Error(data.error||'No se pudo enviar');form.reset();msg.textContent='¡Gracias! Recibimos tu propuesta. Código: '+data.codigo+'. Guardalo como comprobante.'}catch(err){msg.textContent='No se pudo enviar: '+err.message}finally{send.disabled=false}});
</script></body></html>
